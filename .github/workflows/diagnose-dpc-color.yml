name: Diagnostica codifica tile DPC
on:
  push:
    paths:
      - '.github/workflows/diagnose-dpc-color.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Installa Pillow
        run: pip install Pillow
      - name: Ispeziona campioni radar
        shell: python
        run: |
          import datetime,json,urllib.request,urllib.parse,math,collections,io,re
          from PIL import Image
          def get(url,headers={}):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Origin':'https://radar.protezionecivile.it',**headers})
              with urllib.request.urlopen(req,timeout=15) as r:return r.read()
          def tilenum(lat,lon,z=6):
              latrad=math.radians(lat);n=2**z
              return int((lon+180)/360*n),int((1-math.asinh(math.tan(latrad))/math.pi)/2*n)
          centers=[(40.0,9.0),(41.0,9.2),(39.3,8.9),(40.6,8.4),(40.3,9.5)]
          for product,fn in [('CUM24','cum24'),('CUM3','cum3'),('SRT1','srt1'),('VMI','vmi')]:
              try:
                  obj=json.loads(get('https://radar-api.protezionecivile.it/findLastProductByType?type='+product))
                  t=int(obj['lastProducts'][0]['time'])
                  stamp=datetime.datetime.fromtimestamp(t/1000,datetime.timezone.utc)
                  urlprefix='https://s3-prod-dpc-radar-webp-cache.s3.eu-south-1.amazonaws.com/'+product+'/'+stamp.strftime('%Y/%m/%d/%H%M')+'/'
                  print('PRODUCT',product,'DATE',stamp.isoformat(),flush=True)
                  for lat,lon in centers:
                      x,y=tilenum(lat,lon)
                      u=urlprefix+'6/'+str(x)+'/'+str(y)+'/'+fn+'.webp'
                      try:
                          raw=get(u)
                          im=Image.open(io.BytesIO(raw)).convert('RGBA')
                          counts=collections.Counter(im.getdata())
                          active=[(k,v) for k,v in counts.items() if k[3]>0 and max(k[:3])>12]
                          red=sum(v for k,v in active if k[0]>30 and k[1]<max(18,k[0]*.2) and k[2]<max(18,k[0]*.2))
                          total=sum(v for k,v in active)
                          print('TILE',product,lat,lon,'url',u,'size',len(raw),'mode',im.mode,'unique',len(counts),'active',total,'red_ratio',round(red/max(total,1),3),'top',counts.most_common(10),'active_top',sorted(active,key=lambda t:-t[1])[:12],flush=True)
                      except Exception as e:print('TILE_FAIL',product,lat,lon,str(e)[:150],flush=True)
              except Exception as e:print('PRODUCT_FAIL',product,str(e)[:160],flush=True)
          try:
              body=get('https://radar.protezionecivile.it/').decode('utf-8','replace')
              print('OFFICIAL_INDEX',len(body),'scripts',re.findall(r'<script[^>]*src=["\\\']([^"\\\']+)',body)[:20],flush=True)
          except Exception as e:print('OFFICIAL_FAIL',str(e)[:100],flush=True)
