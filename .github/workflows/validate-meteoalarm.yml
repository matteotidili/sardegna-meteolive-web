name: Validate MeteoAlarm frontend

on:
  push:
    branches: [fix/meteoalarm-official-map]
    paths:
      - 'index.html'
      - '.github/workflows/validate-meteoalarm.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Estrai JavaScript inline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,flags=re.I|re.S)
          if not scripts:
              raise SystemExit('Nessuno script inline trovato')
          Path('/tmp/app.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          print('script inline:',len(scripts),'byte:',Path('/tmp/app.js').stat().st_size)
          PY
      - name: Verifica sintassi JavaScript
        run: node --check /tmp/app.js
      - name: Verifica integrazione MeteoAlarm
        run: |
          grep -q "METEOALARM_MAP_DATA" index.html
          grep -q "meteoalarmMapFresh" index.html
          grep -q "servizio visuale ufficiale MeteoAlarm" index.html
