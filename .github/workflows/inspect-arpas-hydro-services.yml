name: Inspect ARPAS hydro services

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-arpas-hydro-services.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect services and sample data
        run: |
          set -e
          BASE='https://services6.arcgis.com/VdOe78ROZ6pyB2c8/arcgis/rest/services'
          RT="$BASE/idrometri_real_time_vista/FeatureServer/1"
          HIST="$BASE/ds_accumula_view_read_only/FeatureServer/9"
          FLOW="$BASE/misure_di_portata/FeatureServer/0"

          for spec in "RT $RT" "HIST $HIST" "FLOW $FLOW"; do
            set -- $spec
            NAME=$1; URL=$2
            echo "=== $NAME META ==="
            curl -L --fail --silent --show-error "$URL?f=json" -o "/tmp/$NAME-meta.json"
            python - "$NAME" <<'PY'
          import json,sys
          name=sys.argv[1]
          d=json.load(open(f'/tmp/{name}-meta.json'))
          print('name',d.get('name'))
          print('type',d.get('type'))
          print('objectIdField',d.get('objectIdField'))
          print('maxRecordCount',d.get('maxRecordCount'))
          print('fields',[(f.get('name'),f.get('type'),f.get('alias')) for f in d.get('fields',[])])
          print('relationships',d.get('relationships'))
          print('timeInfo',d.get('timeInfo'))
          PY
          done

          echo '=== REALTIME SAMPLE ==='
          curl -G -L --fail --silent --show-error "$RT/query"             --data-urlencode 'where=1=1'             --data-urlencode 'outFields=*'             --data-urlencode 'returnGeometry=true'             --data-urlencode 'resultRecordCount=5'             --data-urlencode 'f=geojson' -o /tmp/rt.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/rt.json'))
          for f in d.get('features',[]): print(json.dumps(f,ensure_ascii=False))
          PY

          CODE=$(python - <<'PY'
          import json
          d=json.load(open('/tmp/rt.json'))
          print((d.get('features') or [{}])[0].get('properties',{}).get('cod_srv',''))
          PY
          )
          echo "SAMPLE_CODE=$CODE"

          echo '=== HISTORY SAMPLE BY CODE ==='
          for FIELD in cod_srv ss_cod_staz cae_station_id; do
            echo "--- try $FIELD ---"
            curl -G -L --silent --show-error "$HIST/query"               --data-urlencode "where=$FIELD='$CODE'"               --data-urlencode 'outFields=*'               --data-urlencode 'returnGeometry=false'               --data-urlencode 'orderByFields=time DESC'               --data-urlencode 'resultRecordCount=12'               --data-urlencode 'f=json' | python -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d,ensure_ascii=False)[:8000])" || true
          done
