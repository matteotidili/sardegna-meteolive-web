name: Debug LightningMaps websocket behavior

on:
  push:
    branches: [debug/lightning-feed-quality]
    paths:
      - '.github/workflows/debug-lightning-feed.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Estrai logica websocket pubblica
        run: |
          python - <<'PY'
          import urllib.request,re
          u='https://www.lightningmaps.org/min/index.php?f=js/realtime.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          s=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          for token in ['live.data.ws_send=function','live.data.insert=function']:
              i=s.find(token)
              print('TOKEN',token,'AT',i)
              if i>=0:
                  print(s[i:i+6500])
          PY
