name: Verifica stazioni senza marker grigi

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/check-station-markers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markers:
    name: Verifica dati validi su mappe 2D e 3D
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla marker, colori e filtri di validita
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=(
            "function mapStationVisible(s){",
            "function mapStationVisible(s){\n  return baseVisible(s)\n}",
            "stationMarkerValue(s,key=cur)",
            "function stationMarkerHistorical(s,key=cur){",
            "marks.filter(x=>mapStationVisible(x.s))",
            "stations.filter(mapStationVisible).map(s=>",
            "stationParameterIsCurrent(s,key)?col(s[key],P[key].st):'#173b50'",
            "badge.no-data",
            "station3d-mobile-marker.no-data", 
            "value.classList.toggle('no-reading',!usable)",
            "if(mapStationVisible(item.s)&&layer.hasLayer(item.m))",
          )
          for snippet in required:
            assert snippet in html, 'Regressione stazioni: '+snippet
          # WU sospesa: non caricare dati, catalogo o pulsante di rete.
          assert 'const WU_ENABLED=false;' in html
          assert 'data-net="wunderground" hidden style="display:none"' in html
          assert "const ws=WU_ENABLED?mergeWuCatalog" in html
          assert "WU_ENABLED?fetch(DATA+'wunderground.json" in html
          assert "WU_ENABLED?fetch(DATA+'wunderground_app_api_health.json" in html
          assert 'Cerchio grigio con' not in html
          # Nessuna temperatura vecchia puo' sembrare una misura corrente.
          # Rete e catalogo conservati, mappa solo con letture recenti;
          # se la rete si ferma, un avviso esplicito ne spiega la causa.
          assert "function mapStationVisible(s){\n  return baseVisible(s)\n}" in html
          assert 'station-locator-dot' in html
          assert 'station3d-mobile-marker.unavailable-dot' in html
          assert "iconSize:[14,14]" in html
          assert "label.style.display=isCurrent?'block':'none'" in html
          assert "NESSUNA MISURA RECENTE DISPONIBILE" in html
          assert "Stazioni non aggiornate:" in html
          assert "API" in html
          assert "Cerchio con trattino" not in html
          assert "i numeri con bordo arancione tratteggiato sono" not in html
          assert "stations.filter(mapStationVisible).map(s=>" in html
          assert "const rows=stations.filter(baseVisible).sort" in html
          assert "stationParameterIsCurrent(s,key)?col(s[key],P[key].st):'#65717d'" not in html
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          inline=max(scripts,key=len,default='')
          assert len(inline)>100000, 'Script principale non trovato'
          Path('/tmp/sardegna-meteolive-inline.js').write_text(inline,encoding='utf-8')
          print('OK: solo dati recenti numerati; postazioni non aggiornate come piccoli punti senza numeri in 2D/3D')
          PY
      - name: Controlla sintassi JavaScript
        run: node --check /tmp/sardegna-meteolive-inline.js
