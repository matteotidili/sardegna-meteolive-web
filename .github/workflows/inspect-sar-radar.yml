name: Diagnostica sorgente radar ARPAS
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-sar-radar.py'
      - '.github/workflows/inspect-sar-radar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Installa requests
        run: python3 -m pip install --disable-pip-version-check requests
      - name: Analisi pubblicazione radar
        run: python3 scripts/inspect-sar-radar.py
