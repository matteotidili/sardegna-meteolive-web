name: Applica motore satellite fluido

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_satellite_smooth.py'
      - '.github/workflows/patch-satellite-smooth.yml'

permissions:
  contents: write

concurrency:
  group: patch-satellite-smooth
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Applica motore full-frame
        run: python scripts/patch_satellite_smooth.py

      - name: Verifica sintassi JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js

      - name: Pubblica
        run: |
          git config user.name "sardegna-meteolive-web-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rende fluido il satellite True Colour full-frame" || exit 0
          git push
