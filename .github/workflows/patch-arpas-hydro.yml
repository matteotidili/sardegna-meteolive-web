name: Integra idrometri ARPAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_arpas_hydro.py'
      - '.github/workflows/patch-arpas-hydro.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verifica endpoint ARPAS e CORS
        run: |
          URL='https://services6.arcgis.com/VdOe78ROZ6pyB2c8/arcgis/rest/services/idrometri_real_time_vista/FeatureServer/1/query?where=1%3D1&returnCountOnly=true&f=json'
          curl -L --fail --silent --show-error -D /tmp/headers "$URL" -o /tmp/count.json
          cat /tmp/count.json
          grep -i 'access-control-allow-origin' /tmp/headers || true
      - name: Applica integrazione
        run: python scripts/patch_arpas_hydro.py
      - name: Verifica JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Pubblica
        run: |
          git config user.name "sardegna-meteolive-web-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Integra idrometri ARPAS con soglie e idrogrammi" || exit 0
          git push
