name: Corregge verifica soglie ARPAS
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_arpas_hydro_thresholds.py'
      - '.github/workflows/fix-arpas-hydro-thresholds.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica correzione
        run: python scripts/fix_arpas_hydro_thresholds.py
      - name: Verifica sintassi JavaScript e casi di soglia
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',html,re.I)
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/inline.js','utf8');
          const a=s.indexOf('function hydroNum('),b=s.indexOf('function hydroColor(',a);
          if(a<0||b<a)throw Error('Blocco idrometrico mancante');
          const {hydroStage,hydroStale,hydroHasThresholds}=new Function(s.slice(a,b)+';return {hydroStage,hydroStale,hydroHasThresholds}')();
          const t=Date.now()-30*60000;
          const tests=[
            [{value:0.413,s1:1.7,s2:2.2,s3:3.7,time:t},0,'Livello ARPAS normale'],
            [{value:4.0,s1:1.7,s2:2.2,s3:3.7,time:t},3,'Superamento S3'],
            [{value:3.7,s1:1.7,s2:2.2,s3:3.7,time:t},2,'Uguaglianza S3 non superamento'],
            [{value:0.5,s1:0,s2:0,s3:0,time:t},-3,'Soglie convenzionali nulle'],
            [{value:2,s1:3,s2:2,s3:1,time:t},-3,'Soglie invertite'],
            [{value:4,s1:null,s2:null,s3:null,time:t},-3,'Soglie mancanti'],
            [{value:4,s1:1,s2:2,s3:3,time:t-4*3600000},-2,'Dato non aggiornato'],
            [{value:4,s1:1,s2:2,s3:3,time:new Date(t).toISOString()},3,'Ora ISO8601'],
          ];
          for(const [p,expected,name] of tests){
            const actual=hydroStage(p);
            if(actual!==expected)throw Error(name+': atteso '+expected+' ottenuto '+actual);
            console.log('PASS',name)
          }
          console.log('Test soglie ARPAS: 8/8 superati')
          JS
      - name: Pubblica
        run: |
          git config user.name "sardegna-meteolive-web-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Valida soglie idrometriche ARPAS prima del colore" || exit 0
          git push
