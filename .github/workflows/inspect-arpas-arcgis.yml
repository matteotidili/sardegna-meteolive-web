name: Inspect ARPAS ArcGIS dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-arpas-arcgis.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch dashboard item and data
        run: |
          set -e
          ITEM='0a1dc031c476445493f758af2e2f848a'
          curl -L --fail --silent --show-error "https://www.arcgis.com/sharing/rest/content/items/$ITEM?f=json" -o /tmp/item.json
          curl -L --fail --silent --show-error "https://www.arcgis.com/sharing/rest/content/items/$ITEM/data?f=json" -o /tmp/data.json
          echo '=== ITEM ==='
          python - <<'PY'
          import json
          d=json.load(open('/tmp/item.json'))
          print(json.dumps({k:d.get(k) for k in ['id','title','type','url','owner','access','modified']},indent=2,ensure_ascii=False))
          PY
          echo '=== DATA KEYS ==='
          python - <<'PY'
          import json,re
          d=json.load(open('/tmp/data.json'))
          print(list(d.keys()))
          txt=json.dumps(d,ensure_ascii=False)
          ids=sorted(set(re.findall(r'\b[a-f0-9]{32}\b',txt,re.I)))
          urls=sorted(set(re.findall(r'https?://[^"\\]+',txt)))
          print('ITEM_IDS',ids)
          print('URLS')
          for u in urls: print(u)
          open('/tmp/ids.txt','w').write('\n'.join(ids))
          PY
          echo '=== LINKED ITEMS ==='
          while read ID; do
            [ "$ID" = "$ITEM" ] && continue
            echo "--- $ID ---"
            curl -L --fail --silent "https://www.arcgis.com/sharing/rest/content/items/$ID?f=json" | python -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ['id','title','type','url','owner','access']},ensure_ascii=False))" || true
          done < /tmp/ids.txt
