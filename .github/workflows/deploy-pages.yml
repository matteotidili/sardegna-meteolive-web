name: Deploy Sardegna MeteoLive (GitHub Pages)

# Builds the React app (frontend/) as a fully static site and publishes it to GitHub Pages.
# The previous monolithic site is published unchanged under /classic/.
# Repository setting required once: Settings → Pages → Source = "GitHub Actions".
# Runs on every push to the repository's DEFAULT branch (whatever its name) or manually.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test proiezione numerica radar DPC e conversione Z–R
        working-directory: frontend
        run: |
          if [ -f yarn.lock ]; then yarn install --frozen-lockfile; else yarn install --network-timeout 600000; fi
          yarn vitest run src/lib/radarPoint.test.ts
      - name: Build static site
        working-directory: frontend
        env:
          DISABLE_VISUAL_EDITS: "true"
          DISABLE_EMERGENT_OVERLAY: "true"
        run: |
          # yarn.lock may be omitted by the export tool: use it when present, otherwise resolve package.json
          yarn build
      - name: Add classic site
        run: |
          mkdir -p frontend/dist/classic
          tar --exclude=.github -C classic -cf - . | tar -C frontend/dist/classic -xf -
          touch frontend/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
