name: Verifica idrometri ARPAS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-hydro-arpas.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scarica metadati servizio
        run: |
          BASE='https://services6.arcgis.com/VdOe78ROZ6pyB2c8/arcgis/rest/services/idrometri_real_time_vista/FeatureServer/1'
          curl -L --fail --silent --show-error "$BASE?f=pjson" -o /tmp/meta.json
          jq '{name,displayField,objectIdField,fields:[.fields[]|{name,alias,type,domain}]}' /tmp/meta.json > /tmp/meta_slim.json
          cat /tmp/meta_slim.json
      - name: Analizza dati realtime
        run: |
          BASE='https://services6.arcgis.com/VdOe78ROZ6pyB2c8/arcgis/rest/services/idrometri_real_time_vista/FeatureServer/1'
          curl -L --fail --silent --show-error --get "$BASE/query"             --data-urlencode 'where=1=1'             --data-urlencode 'outFields=cod_srv,cae_nome,altra_denominazione,localita,time,value,trend,zero,s1,s2,s3,nota_m_slm,note'             --data-urlencode 'returnGeometry=false'             --data-urlencode 'f=json' -o /tmp/data.json
          echo '--- COUNTS ---'
          jq '{
            total:(.features|length),
            fresh:(.features|map(.attributes)|map(select(.time != null))|length),
            s1_fields:(.features|map(.attributes)|map(select(.s1 != null))|length),
            s2_fields:(.features|map(.attributes)|map(select(.s2 != null))|length),
            s3_fields:(.features|map(.attributes)|map(select(.s3 != null))|length),
            over_s1:(.features|map(.attributes)|map(select((.value|type)=="number" and (.s1|type)=="number" and .value>=.s1))|length),
            over_s2:(.features|map(.attributes)|map(select((.value|type)=="number" and (.s2|type)=="number" and .value>=.s2))|length),
            over_s3:(.features|map(.attributes)|map(select((.value|type)=="number" and (.s3|type)=="number" and .value>=.s3))|length)
          }' /tmp/data.json
          echo '--- OVER S3 ---'
          jq -r '.features|map(.attributes)|map(select((.value|type)=="number" and (.s3|type)=="number" and .value>=.s3))|sort_by(.value-.s3)|reverse|.[]|[.cod_srv,.cae_nome,.localita,.time,.value,.s1,.s2,.s3,.trend,.zero,.nota_m_slm,.note]|@tsv' /tmp/data.json
          echo '--- FIRST 20 ---'
          jq -r '.features|map(.attributes)|sort_by(.cae_nome // .cod_srv)|.[0:20][]|[.cod_srv,.cae_nome,.localita,.time,.value,.s1,.s2,.s3,.trend,.zero]|@tsv' /tmp/data.json
