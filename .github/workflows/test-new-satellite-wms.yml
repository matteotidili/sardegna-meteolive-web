name: Test WMS nuovi satelliti

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-new-satellite-wms.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Day Snow Fog RGB
        run: |
          URL='https://view.eumetsat.int/geoserver/ows?service=WMS&request=GetMap&version=1.1.1&layers=mtg_fd:rgb_snow&styles=&format=image/png&srs=EPSG:4326&bbox=7.2,38.2,10.8,41.8&width=256&height=256'
          curl -L --fail --silent --show-error -D /tmp/snow_headers "$URL" -o /tmp/snow.png
          echo "SNOW_BYTES=$(wc -c </tmp/snow.png)"
          file /tmp/snow.png
          cat /tmp/snow_headers
      - name: Test H40B precipitation rate
        run: |
          URL='https://view.eumetsat.int/geoserver/ows?service=WMS&request=GetMap&version=1.1.1&layers=mtg_fd:h40b&styles=&format=image/png&srs=EPSG:4326&bbox=7.2,38.2,10.8,41.8&width=256&height=256'
          curl -L --fail --silent --show-error -D /tmp/h40_headers "$URL" -o /tmp/h40.png
          echo "H40B_BYTES=$(wc -c </tmp/h40.png)"
          file /tmp/h40.png
          cat /tmp/h40_headers
