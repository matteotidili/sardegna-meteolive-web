name: Inspect ARPAS hydro webmap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-arpas-hydro-webmap.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect ARPAS hydrometric web map
        run: |
          set -e
          ITEM='73d051462ccc45d593029e93a1ac1882'
          curl -L --fail --silent --show-error "https://www.arcgis.com/sharing/rest/content/items/$ITEM/data?f=json" -o /tmp/webmap.json
          python - <<'PY'
          import json,re
          d=json.load(open('/tmp/webmap.json'))
          print('TOP_KEYS', list(d.keys()))
          print('OPERATIONAL_LAYERS')
          for i,l in enumerate(d.get('operationalLayers',[])):
              print('\nLAYER',i)
              for k in ['id','title','url','itemId','layerType','visibility']:
                  if k in l: print(k,repr(l.get(k)))
              print('popupInfo_fields',[x.get('fieldName') for x in (l.get('popupInfo') or {}).get('fieldInfos',[])])
              print('renderer',json.dumps((l.get('layerDefinition') or {}).get('drawingInfo') or l.get('drawingInfo'),ensure_ascii=False)[:3000])
          txt=json.dumps(d,ensure_ascii=False)
          print('\nURLS')
          for u in sorted(set(re.findall(r'https?://[^"\\]+',txt))): print(u)
          print('\nITEM_IDS')
          for x in sorted(set(re.findall(r'\b[a-f0-9]{32}\b',txt,re.I))): print(x)
          PY
