name: Validate mobile overlay layout

on:
  push:
    branches: [fix/mobile-overlay-layout]
    paths:
      - 'index.html'
      - '.github/workflows/validate-mobile-overlay.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verifica sintassi e regole mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            "function activeTimelineElements()",
            "stationEl.classList.toggle('mobile-suppressed'",
            "--mobile-stack-bottom",
            ".leaflet-control-attribution{",
            ".status{display:none!important}",
            "max-height:min(25dvh,180px)"
          ]
          for item in required:
              assert item in html, item
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,flags=re.I|re.S)
          Path('/tmp/app.js').write_text(chr(10).join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
