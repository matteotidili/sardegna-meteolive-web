name: Applica patch satellite HD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_satellite_hd.py'
      - '.github/workflows/patch-satellite-hd.yml'

permissions:
  contents: write

concurrency:
  group: patch-satellite-hd
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Applica patch
        run: python scripts/patch_satellite_hd.py

      - name: Verifica sintassi JavaScript inline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js

      - name: Pubblica modifica
        run: |
          git config user.name "sardegna-meteolive-web-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi
          git commit -m "Usa WMS nativo su tutti i frame satellite"
          git push
