name: Validate MeteoAlarm alert UI

on:
  push:
    branches: [fix/meteoalarm-alert-readability]
    paths:
      - 'index.html'
      - '.github/workflows/validate-meteoalarm-alert-ui.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verifica sintassi e testi
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'Fonte MeteoAlarm / EUMETNET' in html
          assert 'Copertura e disponibilità dei paesi' not in html
          assert 'feed CAP dei paesi mediterranei coperti' not in html
          assert 'function meteoalarmValidity(' in html
          assert "FENOMENI '+hazards.join(' · ')" in html
          assert "'VALIDITÀ '+startDay" in html
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,flags=re.I|re.S)
          Path('/tmp/app.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
