name: Integra Snow Fog e H40B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_satellite_snow_h40b.py'
      - '.github/workflows/patch-satellite-snow-h40b.yml'

permissions:
  contents: write

concurrency:
  group: patch-satellite-snow-h40b
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integra prodotti
        run: python scripts/patch_satellite_snow_h40b.py
      - name: Verifica JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Pubblica
        run: |
          git config user.name "sardegna-meteolive-web-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Integra Day Snow Fog RGB e H40B" || exit 0
          git push
