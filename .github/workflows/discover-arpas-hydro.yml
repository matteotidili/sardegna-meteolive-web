name: Scopri endpoint ARPAS idrometri

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-arpas-hydro.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Analizza layer idrometrici ARPAS
        run: |
          set -e
          REAL='https://services6.arcgis.com/VdOe78ROZ6pyB2c8/arcgis/rest/services/idrometri_real_time_vista/FeatureServer/1'
          HIST='https://services6.arcgis.com/VdOe78ROZ6pyB2c8/arcgis/rest/services/ds_accumula_view_read_only/FeatureServer/9'
          PORT='https://services6.arcgis.com/VdOe78ROZ6pyB2c8/arcgis/rest/services/misure_di_portata/FeatureServer/0'

          for NAME in REAL HIST PORT; do
            eval URL=\$$NAME
            echo "===== $NAME METADATA ====="
            curl -L --fail --silent --show-error "$URL?f=pjson" -o "/tmp/$NAME-meta.json"
            python - "$NAME" <<'PY'
          import json,sys
          name=sys.argv[1]
          d=json.load(open(f'/tmp/{name}-meta.json'))
          print('name:',d.get('name'))
          print('geometryType:',d.get('geometryType'))
          print('objectIdField:',d.get('objectIdField'))
          print('maxRecordCount:',d.get('maxRecordCount'))
          print('fields:')
          for f in d.get('fields',[]):
              print(' ',f.get('name'),'|',f.get('alias'),'|',f.get('type'))
          PY

            echo "===== $NAME SAMPLE ====="
            curl -L --fail --silent --show-error --get "$URL/query" \
              --data-urlencode 'where=1=1' \
              --data-urlencode 'outFields=*' \
              --data-urlencode 'returnGeometry=true' \
              --data-urlencode 'resultRecordCount=3' \
              --data-urlencode 'f=pjson' -o "/tmp/$NAME-query.json"
            python - "$NAME" <<'PY'
          import json,sys
          name=sys.argv[1]
          d=json.load(open(f'/tmp/{name}-query.json'))
          print('exceededTransferLimit:',d.get('exceededTransferLimit'))
          for ft in d.get('features',[]):
              print('ATTR',json.dumps(ft.get('attributes'),ensure_ascii=False))
              print('GEOM',json.dumps(ft.get('geometry'),ensure_ascii=False))
          if 'error' in d: print('ERROR',d['error'])
          PY
          done
