name: Aggiorna stazioni MeteoNetwork

# Token STANDARD MeteoNetwork: 1 richiesta per stazione, max 5/min (pausa 12.5 s), 1 thread.
# Credenziali solo nei secret del repository: MNW_EMAIL e MNW_PASSWORD (oppure MNW_TOKEN).
# Elenco stazioni in config/meteonetwork_stations.json (max 60 -> ciclo < 13 min).
on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'

permissions:
  contents: write

concurrency:
  group: meteonetwork
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest tests/test_meteonetwork.py
      - name: Raccogli osservazioni
        env:
          MNW_EMAIL: ${{ secrets.MNW_EMAIL }}
          MNW_PASSWORD: ${{ secrets.MNW_PASSWORD }}
          MNW_TOKEN: ${{ secrets.MNW_TOKEN }}
        run: python scripts/update_meteonetwork.py
      - name: Pubblica (con gestione collisioni)
        run: |
          git config user.name "sardegna-meteolive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/meteonetwork.json ] || { echo "Nessun file prodotto"; exit 0; }
          cp data/meteonetwork.json /tmp/mnw.json
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main && git reset --hard origin/main --quiet
            cp /tmp/mnw.json data/meteonetwork.json
            git add data/meteonetwork.json
            if git diff --cached --quiet; then echo "Nessuna modifica"; exit 0; fi
            git commit -m "Aggiorna stazioni MeteoNetwork" --quiet
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 7))
          done
          echo "Push non riuscito dopo 5 tentativi"; exit 1
