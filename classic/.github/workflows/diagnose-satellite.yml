name: Diagnostica temporanea satellite EUMETView
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-satellite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Controlla WMS EUMETSAT (nessuna credenziale)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,urllib.request,urllib.parse,urllib.error,re,time
          BASE='https://view.eumetsat.int/geoserver/wms'
          def req(param,tag,timeout=18):
              url=BASE+'?'+urllib.parse.urlencode(param)
              request=urllib.request.Request(url,headers={'User-Agent':'Sardegna MeteoLive satellite diagnostic/1.0','Origin':'https://matteotidili.github.io'})
              begin=time.monotonic()
              try:
                  with urllib.request.urlopen(request,timeout=timeout) as r:
                      body=r.read(1_000_000)
                      print(tag,'status',r.status,'type',r.headers.get('Content-Type'),
                          'cors',r.headers.get('Access-Control-Allow-Origin'),
                          'size-read',len(body),'first',repr(body[:160]),'sec',round(time.monotonic()-begin,2),flush=True)
                      return body
              except urllib.error.HTTPError as e:
                  print(tag,'HTTP',e.code,'type',e.headers.get('Content-Type'),'cors',e.headers.get('Access-Control-Allow-Origin'),
                     'body',repr(e.read(300)),'sec',round(time.monotonic()-begin,2),flush=True)
              except Exception as e:print(tag,type(e).__name__,str(e)[:200],flush=True)
              return b''
          caps=req({'service':'WMS','version':'1.3.0','request':'GetCapabilities'},'CAPABILITIES',25)
          for name in ('rgb_truecolour','ir105_hrfi','rgb_cloudphase','rgb_snow','h40b','rgb_geocolour'):
              print('LAYER_TOKEN',name,'in_caps',('mtg_fd:'+name).encode() in caps,flush=True)
          now=datetime.datetime.now(datetime.timezone.utc)
          times=[None,
              (now-datetime.timedelta(minutes=20)).replace(minute=(now.minute//10)*10,second=0,microsecond=0).isoformat().replace('+00:00','Z')]
          for name in ('rgb_truecolour','ir105_hrfi','rgb_cloudphase','rgb_snow','h40b','rgb_geocolour'):
              for time_value in times:
                  p={'service':'WMS','version':'1.1.1','request':'GetMap','layers':'mtg_fd:'+name,'styles':'',
                     'format':'image/png','transparent':'true','srs':'EPSG:4326','bbox':'7.2,38.2,10.8,41.8','width':'48','height':'48'}
                  if time_value:p['time']=time_value
                  req(p,'MAP '+name+' '+('CURRENT_MINUS_20' if time_value else 'WITHOUT_TIME'),15)
          PY
